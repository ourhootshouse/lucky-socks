<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent 89 — Fantasy Football</title>
<meta name="description" content="A fantasy football scouting desk: lineup checks, trade grades, intel and waiver picks for your ESPN league.">
<meta name="theme-color" content="#070d18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agent 89">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="badge89" aria-hidden="true">89</span><div><b>Agent 89</b><small>scouting desk · fantasy football</small></div></div>
  <div class="top-right">
    <select id="leagueSwitch" aria-label="Switch league" hidden></select>
    <button id="themeBtn" class="icon-btn" aria-label="Toggle light/dark mode" title="Toggle light/dark">🌓</button>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="team"><i>📋</i><span>Team</span></button>
  <button data-tab="trade"><i>🔁</i><span>Trade</span></button>
  <button data-tab="ideas"><i>📡</i><span>Intel</span></button>
  <button data-tab="waivers"><i>🔍</i><span>Waivers</span></button>
  <button data-tab="remind"><i>⏰</i><span>Brief</span></button>
  <button data-tab="leagues"><i>🏈</i><span>Leagues</span></button>
</nav>
<main id="view" aria-live="polite"></main>
<footer class="foot">Fan-made. Not affiliated with the NFL, ESPN, or any team.<br><span>Agent 89 reads your league from ESPN's unofficial API. Advice is for fun; you still have to set the lineup.</span></footer>
<noscript><p style="padding:1rem">Agent 89 needs JavaScript to pull the film.</p></noscript>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="espn.js"></script>
<script src="app.js"></script>
</body>
</html>
